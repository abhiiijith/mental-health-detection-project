<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health • User List</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F9FAF5;
      --card:#ffffff;
      --text:#1f2933;
      --muted:#6b7280;
      --green:#66BB6A;
      --green-dark:#2E7D32;
      --border:#d1fae5;
      --soft:#ecfdf5;
      --danger:#dc2626;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Inter',sans-serif;
    }

    body{
      background:var(--bg);
      padding:30px 20px;
      color:var(--text);
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:24px;
      color:var(--green-dark);
      font-size:26px;
      font-weight:700;
    }

    .top-bar{
      display:flex;
      justify-content:flex-start;
      margin-bottom:16px;
    }

    .back-btn{
      background:var(--green);
      color:white;
      padding:10px 18px;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      transition:.3s;
    }

    .back-btn:hover{
      background:var(--green-dark);
      transform:translateY(-2px);
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      background:var(--card);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 20px 40px rgba(0,0,0,.08);
    }

    th, td{
      padding:14px 16px;
      text-align:left;
      font-size:14px;
    }

    th{
      background:#ecfdf5;
      color:var(--green-dark);
      font-weight:700;
      text-transform:uppercase;
      font-size:12px;
      letter-spacing:.5px;
      border-bottom:1px solid var(--border);
    }

    tr{
      border-bottom:1px solid var(--border);
    }

    tr:last-child{
      border-bottom:none;
    }

    tbody tr:hover{
      background:#f0fdf4;
    }

    td{
      color:var(--text);
    }

    .delete-btn{
      background:transparent;
      color:var(--danger);
      border:1px solid var(--danger);
      padding:6px 14px;
      border-radius:10px;
      cursor:pointer;
      text-decoration:none;
      font-size:13px;
      font-weight:600;
      transition:.3s;
    }

    .delete-btn:hover{
      background:var(--danger);
      color:white;
    }

    .empty{
      text-align:center;
      padding:20px;
      color:var(--muted);
      font-size:14px;
    }

    @media(max-width:768px){
      table{
        font-size:13px;
      }
      th, td{
        padding:10px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Registered Users</h1>

  <div class="top-bar">
    <a href="{% url 'adminhome' %}" class="back-btn">← Back to Dashboard</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Message</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.user }}</td>
        <td>{{ user.message }}</td>
        <td>
          <a href="{% url 'deletefeedback' user.id %}"
             class="delete-btn"
             onclick="return confirm('Are you sure you want to delete this user?')">
            Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="empty">No users found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
