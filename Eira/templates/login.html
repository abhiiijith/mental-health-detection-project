<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • Mental Health</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F9FAF5;
    }
    .gradient-text {
      background: -webkit-linear-gradient(45deg, #2E7D32, #66BB6A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .soft-card {
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-4xl bg-white rounded-3xl soft-card overflow-hidden grid md:grid-cols-2">

    <!-- Left Section -->
    <div class="hidden md:flex flex-col justify-center p-10 bg-gradient-to-br from-green-100 to-green-50">
      <h1 class="text-4xl font-bold mb-4">
        Welcome Back to <span class="gradient-text">Mental Health</span>
      </h1>
      <p class="text-gray-600 leading-relaxed">
        Continue your journey toward emotional balance and clarity.
        We’re glad you’re back 🌱
      </p>
    </div>

    <!-- Right Section -->
    <div class="p-8 md:p-10">
      <h2 class="text-2xl font-bold text-gray-800 mb-1">Sign In</h2>
      <p class="text-sm text-gray-500 mb-6">Access your dashboard securely</p>

      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <!-- Email -->
        <div>
          <label class="text-sm text-gray-600">Email</label>
          <input type="email" name="email" required
            class="w-full mt-1 px-4 py-3 rounded-xl border border-green-200 focus:ring-2 focus:ring-green-300 focus:outline-none"
            placeholder="you@example.com">
        </div>

        <!-- Password -->
        <div>
          <label class="text-sm text-gray-600">Password</label>
          <input type="password" name="password" minlength="6" required
            class="w-full mt-1 px-4 py-3 rounded-xl border border-green-200 focus:ring-2 focus:ring-green-300 focus:outline-none"
            placeholder="Enter your password">
        </div>

        <!-- Remember / Forgot -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-600">
            <input type="checkbox" class="accent-green-600">
            Remember me
          </label>
          <a href="{% url 'forgot_password' %}" class="text-green-700 font-semibold hover:underline">
            Forgot password?
          </a>
        </div>

        <!-- Button -->
        <button type="submit"
          class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold transition">
          Sign In
        </button>
             

        <!-- Footer -->
        <p class="text-center text-sm text-gray-500 mt-4">
          Don’t have an account?
          <a href="{% url 'register' %}" class="text-green-700 font-semibold hover:underline">
            Create one
          </a>
        </p>
      </form>
    </div>

  </div>

</body>
</html>
