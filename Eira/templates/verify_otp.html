{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <base href="{% static '' %}">
    <title>Verify OTP | Mental Health</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        :root {
            --primary-green: #28a745;
            --dark-green: #1e4620;
            --light-bg: #ffffff;
            --input-bg: #f7fdf7;
            --text-dark: #333;
        }

        body {
            height: 100vh;
            background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url('images/bg_3.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }

        .card-form {
            background: var(--light-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.8s ease-out;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-green);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header-section p {
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-left: 5px;
        }

        .form-control {
            border: 1px solid #cce6cc;
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.3s ease;
            background: var(--input-bg);
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(40,167,69,0.2);
            background: #fff;
        }

        .btn-submit {
            background: var(--primary-green);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: var(--dark-green);
            color: #fff;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-dark);
            text-decoration: none;
        }
        .back-login:hover { color: var(--primary-green); }

        /* Messages styling */
        .alert {
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card-form">
        <div class="header-section">
            <h2>Verify OTP</h2>
            <p>Check your email and enter the OTP</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 small text-center" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-4">
                <label for="otp" class="form-label">Enter OTP</label>
                <input type="text" class="form-control" id="otp" name="otp" placeholder="6-digit OTP" required>
            </div>

            <button type="submit" class="btn btn-submit">Verify OTP</button>
        </form>

        <a href="{% url 'forgot_password' %}" class="back-login">Resend OTP / Back</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
