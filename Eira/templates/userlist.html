<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User List</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
    }

    th {
      background-color: #1e3a8a;
      color: white;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #f1f5f9;
    }

    tr:hover {
      background-color: #e2e8f0;
    }

    td {
      color: #334155;
      font-size: 0.95rem;
    }

    .delete-btn {
      background-color: #dc2626;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      background-color: #b91c1c;
    }

    .add-user {
      display: inline-block;
      margin-bottom: 15px;
      background-color: #2563eb;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.3s;
    }

    .add-user:hover {
      background-color: #1d4ed8;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      table {
        font-size: 0.8rem;
      }
      th, td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registered Users</h1>
    <a href="{% url 'adminhome' %}" class="add-user">+ Back to Dashboard</a>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Gender</th>
          <th>Location</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.get_gender_display }}</td>
            <td>{{ user.get_location_display }}</td>
            <td>
              <a href="{% url 'deleteuser' user.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete {{ user.name }}?')">Delete</a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="6" style="text-align:center; color:#64748b;">No users found.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
