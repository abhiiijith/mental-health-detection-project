<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email - Mental Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    /* ================= BODY ================= */
    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb; /* soft white background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111827;
    }

    /* ================= CARD ================= */
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      border: 2px solid #22c55e; /* green border */
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #16a34a; /* green title */
      margin-bottom: 12px;
    }

    p {
      color: #374151; /* dark gray text */
      margin-bottom: 30px;
      font-size: 1rem;
    }

    /* ================= MESSAGES ================= */
    .messages { margin-bottom: 20px; text-align: left; }
    .success { color: #16a34a; font-weight: 500; }
    .error { color: #dc2626; font-weight: 500; }

    /* ================= FORM ================= */
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input[type="text"] {
      padding: 16px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 8px;
      border: 2px solid #22c55e; /* green border */
      border-radius: 12px;
      outline: none;
      background: #f9fafb; /* match body */
      color: #111827;
      transition: all 0.25s;
    }

    input[type="text"]:focus {
      border-color: #16a34a;
      box-shadow: 0 0 10px #16a34a33;
      background: #ffffff;
    }

    button {
      padding: 14px;
      background: #22c55e; /* green button */
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }

    button:hover {
      background: #16a34a;
      box-shadow: 0 4px 15px rgba(22,163,74,0.4);
    }

    /* ================= RESEND LINK ================= */
    .resend {
      margin-top: 20px;
      color: #6b7280; /* gray text */
      font-size: 0.9rem;
    }
    .resend a {
      color: #22c55e;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s;
    }
    .resend a:hover { color: #16a34a; text-decoration: underline; }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 420px){
      .card { padding: 30px 20px; }
      input[type="text"] { font-size: 1.1rem; letter-spacing: 6px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="card">
    <h1>Verify Your Email</h1>
    <p>We sent a 6-digit code to <strong>{{ email }}</strong></p>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="text" name="code" maxlength="6"
             pattern="[0-9]{6}"
             inputmode="numeric"
             oninput="this.value=this.value.replace(/[^0-9]/g,'')"
             placeholder="Enter 6-digit code" required autofocus>
      <button type="submit">Verify Email</button>
    </form>

    <div class="resend">
      Didn't receive the code? 
      <a href="{% url 'verify_email' %}">Resend Code</a>
    </div>
</div>

</body>
</html>
