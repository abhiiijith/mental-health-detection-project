<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Chatbot with Speech 🤖</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #f0f8ff;
  }

  #chatbot-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #ffffff;
  }

  #chatbot-header {
    background: #007bff;
    color: white;
    padding: 15px 20px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  #chatbot-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #e9f5ff;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 70%;
    padding: 12px 18px;
    border-radius: 15px;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .message.user {
    background: #007bff;
    color: white;
    margin-left: auto;
  }

  .message.bot {
    background: #cce5ff;
    color: #004085;
    margin-right: auto;
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .chat-input-container {
    display: flex;
    padding: 15px 20px;
    background: #f8f9fa;
    border-top: 1px solid #dee2e6;
    gap: 10px;
  }

  .chat-input {
    flex: 1;
    border-radius: 50px;
    padding: 10px 20px;
    border: 1px solid #ced4da;
    outline: none;
    transition: border-color 0.3s;
  }

  .chat-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0,123,255,0.3);
  }

  .send-button, .speech-button, .stop-button {
    background: #007bff;
    color: white;
    border-radius: 50px;
    border: none;
    padding: 10px 18px;
    font-weight: 600;
    transition: background 0.3s;
  }

  .send-button:hover, .speech-button:hover, .stop-button:hover {
    background: #0056b3;
  }

  #close-chatbot {
    background: transparent;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  #close-chatbot:hover {
    transform: rotate(90deg);
  }
</style>
</head>
<body>

<div id="chatbot-container" class="d-flex flex-column">
  <div id="chatbot-header">
    <span>Smart Chatbot 🤖</span>
    <button id="close-chatbot">&times;</button>
  </div>

  <div id="chatbot-messages" class="flex-grow-1"></div>

  <div class="chat-input-container">
    <input id="chat-input" class="chat-input" type="text" placeholder="Type your message..." />
    <button id="send-chat" class="send-button">Send</button>
    <button id="speech-chat" class="speech-button">🎤</button>
    <button id="stop-speech" class="stop-button">⏹️</button>
  </div>
</div>

<script>
  const closeButton = document.getElementById('close-chatbot');
  const sendButton = document.getElementById('send-chat');
  const speechButton = document.getElementById('speech-chat');
  const stopButton = document.getElementById('stop-speech');
  const chatInput = document.getElementById('chat-input');
  const chatbotMessages = document.getElementById('chatbot-messages');
  const chatbotContainer = document.getElementById('chatbot-container');

  let synth = window.speechSynthesis;

  // Redirect to home page when close button is clicked
  closeButton.addEventListener('click', () => {
      window.location.href = '/home/';
  });

  function sendMessage() {
    const userMessage = chatInput.value.trim();
    if(!userMessage) return;

    displayMessage(userMessage, 'user');
    chatInput.value = '';

    fetch('/chatbot/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}'
      },
      body: JSON.stringify({ message: userMessage })
    })
    .then(res => res.json())
    .then(data => {
      displayMessage(data.response, 'bot');
      speakText(data.response);
    })
    .catch(err => displayMessage('Error: Unable to get response', 'bot'));
  }

  function displayMessage(message, sender){
    message = message.replace(/\*\*/g, '');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender==='user' ? 'user':'bot');

    const lines = message.split('\n').filter(line => line.trim() !== '');
    lines.forEach(line => {
      const lineDiv = document.createElement('div');
      lineDiv.textContent = line.trim();
      msgDiv.appendChild(lineDiv);
    });

    chatbotMessages.appendChild(msgDiv);
    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
  }

  function speakText(text){
    if(synth.speaking) synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    synth.speak(utterance);
  }

  sendButton.addEventListener('click', sendMessage);

  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Speech recognition
  speechButton.addEventListener('click', () => {
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
      alert('Speech Recognition not supported.');
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onresult = (event) => {
      const speechResult = event.results[0][0].transcript;
      chatInput.value = speechResult;
      sendMessage();
    }

    recognition.onerror = (event) => console.error('Speech recognition error', event.error);
  });

  stopButton.addEventListener('click', () => {
    if(synth.speaking) synth.cancel();
  });

  window.onload = () => {
    chatbotContainer.style.display = 'flex';
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
