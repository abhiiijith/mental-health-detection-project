{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <base href="{% static '' %}">
    <title>Reset Password | Mental Health</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        :root {
            --primary-green: #28a745;
            --light-bg: #ffffff;
            --text-dark: #333333;
            --input-bg: #f5f5f5;
        }

        body {
            height:100vh;
            background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url('images/bg_3.jpg');
            background-size: cover;
            background-position: center;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'Poppins', sans-serif;
            margin:0;
        }

        .card-form {
            background:var(--light-bg);
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.15);
            width:100%;
            max-width:420px;
            padding:40px;
            animation:slideUp 0.8s ease-out;
        }

        .header-section {
            text-align:center;
            margin-bottom:30px;
        }

        .header-section h2 {
            font-family:'Playfair Display', serif;
            color:var(--primary-green);
            font-size:2rem;
            margin-bottom:5px;
        }

        .header-section p {
            color:var(--text-dark);
        }

        .form-label {
            font-size:0.85rem;
            font-weight:600;
            color:var(--text-dark);
            margin-left:5px;
        }

        .form-control {
            border:1px solid #ddd;
            border-radius:12px;
            padding:12px 15px;
            transition:all 0.3s ease;
            background:var(--input-bg);
        }

        .form-control:focus {
            border-color:var(--primary-green);
            box-shadow:0 0 0 3px rgba(40,167,69,0.2);
            background:#fff;
        }

        .btn-submit {
            background:var(--primary-green);
            color:white;
            border:none;
            border-radius:12px;
            padding:14px;
            font-weight:600;
            width:100%;
            margin-top:15px;
            transition:all 0.3s;
        }

        .btn-submit:hover {
            background:#218838;
        }

        @keyframes slideUp {
            from {opacity:0; transform:translateY(30px);}
            to {opacity:1; transform:translateY(0);}
        }

        .back-login {
            display:block;
            text-align:center;
            margin-top:20px;
            font-size:0.9rem;
            color:var(--text-dark);
            text-decoration:none;
        }

        .back-login:hover {
            color:var(--primary-green);
        }

        .alert {
            border-radius:12px;
            font-size:0.85rem;
            margin-bottom:15px;
        }

        .password-wrapper{
            position:relative;
        }

        .toggle-eye{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:14px;
            color:#666;
        }

        .error-text{
            color:red;
            font-size:12px;
            margin-top:4px;
        }
    </style>
</head>

<body>

<div class="card-form">

    <div class="header-section">
        <h2>Reset Password</h2>
        <p>Enter your new password</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2 small text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" id="resetForm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">New Password</label>

            <div class="password-wrapper">
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                <span class="toggle-eye" onclick="togglePassword('password')">👁</span>
            </div>

            <div id="passwordError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>

            <div class="password-wrapper">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                <span class="toggle-eye" onclick="togglePassword('confirm_password')">👁</span>
            </div>

            <div id="confirmError" class="error-text"></div>
        </div>

        <button type="submit" class="btn btn-submit">Change Password</button>

    </form>

    <a href="{% url 'login' %}" class="back-login">Back to Login</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* Show / Hide Password */

function togglePassword(id){
    let input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
    }else{
        input.type="password";
    }
}


/* Password Validation */

document.getElementById("resetForm").addEventListener("submit",function(e){

    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirm_password").value;

    let passwordError=document.getElementById("passwordError");
    let confirmError=document.getElementById("confirmError");

    passwordError.innerHTML="";
    confirmError.innerHTML="";

    let pattern=/^(?=.*[A-Z])(?=.*[0-9])(?=.*[\W]).{8,}$/;

    if(!pattern.test(password)){
        passwordError.innerHTML="Password must contain 8 characters, 1 uppercase, 1 number and 1 special character";
        e.preventDefault();
        return;
    }

    if(password!==confirm){
        confirmError.innerHTML="Passwords do not match";
        e.preventDefault();
        return;
    }

});

</script>

</body>
</html>
