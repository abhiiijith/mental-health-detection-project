<!DOCTYPE html>
<html lang="en">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile • Mental Health</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  font-family:'Inter',sans-serif;
  background:#F9FAF5;
}

.app-header{
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #e6f4ea;
}

.header-inner{
  max-width: 1200px;
  margin: auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#e9f0ed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2E7D32;
}

.brand-name{
  font-size:18px;
  font-weight:700;
  color:#2E7D32;
}

.nav-link{
  font-size:14px;
  font-weight:600;
  color:#2E7D32;
  padding:8px 16px;
  border-radius:999px;
  transition:.25s;
}

.nav-link:hover{
  background:#ecfdf5;
}

.soft-card{
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<header class="app-header">
<div class="header-inner">

<div class="brand">
  <div class="brand-icon">
    <span class="material-symbols-outlined">psychology</span>
  </div>
  <span class="brand-name">Mental Health</span>
</div>

<a href="/home" class="nav-link">Home</a>

</div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">

<h1 class="text-3xl font-bold text-gray-800 mb-2">Account Settings</h1>
<p class="text-gray-500 mb-8">Update your personal information</p>

<form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
{% csrf_token %}

<div class="grid md:grid-cols-3 gap-8">

<!-- LEFT PROFILE -->
<div class="bg-white rounded-3xl p-6 soft-card flex flex-col items-center text-center">

  <label for="profileImage" class="cursor-pointer block">
    {% if c.image %}
      <img src="{{ c.image.url }}"
        id="profilePreview"
        class="w-32 h-32 rounded-full object-cover border-4 border-green-100 hover:opacity-90 transition">
    {% else %}
      <div id="profilePreview"
        class="w-32 h-32 rounded-full border-2 border-dashed border-green-400
        bg-green-50 flex flex-col items-center justify-center
        hover:bg-green-100 transition">

        <span class="material-symbols-outlined text-green-700 text-3xl">photo_camera</span>
        <span class="text-xs text-green-700 mt-1">Tap to add</span>

      </div>
    {% endif %}
  </label>

  <input type="file" name="image" id="profileImage" accept="image/*" hidden>

  <!-- REMOVE BUTTON -->
  {% if c.image %}
  <button type="button" id="removeImageBtn"
    class="mt-3 text-sm text-red-600 hover:underline">
    Remove Photo
  </button>
  {% endif %}

  <h3 class="mt-4 font-semibold text-lg text-gray-800">{{ c.name }}</h3>
  <p class="text-sm text-gray-500">Profile photo</p>
  <p class="text-xs text-gray-400 mt-4">Click the photo to upload a new one.</p>

</div>

<!-- RIGHT CARD -->
<div class="md:col-span-2 bg-white rounded-3xl p-8 soft-card">

<h2 class="text-xl font-semibold text-gray-800 mb-6">Personal Information</h2>

<div class="space-y-5">

<!-- NAME -->
<div>
<label class="text-sm text-gray-600">Full Name</label>
<input type="text"
  name="name"
  value="{{ c.name }}"
  required
  minlength="3"
  maxlength="50"
  pattern="[A-Za-z ]+"
  title="Name should contain only letters"
  class="w-full mt-1 px-4 py-3 rounded-xl border border-green-200
  focus:ring-2 focus:ring-green-300 focus:outline-none">
</div>

<!-- EMAIL -->
<div>
<label class="text-sm text-gray-600">Email</label>
<input type="email"
  name="email"
  value="{{ c.email }}"
  required
  class="w-full mt-1 px-4 py-3 rounded-xl border border-green-200
  focus:ring-2 focus:ring-green-300 focus:outline-none">
</div>

<!-- LOCATION -->
<div>
<label class="text-sm text-gray-600">Location</label>
<input type="text"
  name="location"
  value="{{ c.location }}"
  required
  maxlength="100"
  class="w-full mt-1 px-4 py-3 rounded-xl border border-green-200
  focus:ring-2 focus:ring-green-300 focus:outline-none">
</div>

<!-- PASSWORD -->
<div>
<label class="text-sm text-gray-600">Password</label>
<div class="relative">
  <input id="passwordInput"
    type="password"
    name="password"
    value="{{ c.password }}"
    required
    minlength="4"
    maxlength="20"
    title="Password must be 4-20 characters"
    class="w-full mt-1 px-4 pr-12 py-3 rounded-xl border border-green-200
    focus:ring-2 focus:ring-green-300 focus:outline-none">
  <span onclick="togglePassword()"
    class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer">
    visibility
  </span>
</div>
</div>

<!-- GENDER -->
<div>
<label class="text-sm text-gray-600 block mb-2">Gender</label>
<div class="flex gap-6 flex-wrap">
  <label class="flex items-center gap-2">
    <input type="radio" name="gender" value="MALE"
    {% if c.gender == "MALE" %}checked{% endif %}
    class="accent-green-600"> Male
  </label>
  <label class="flex items-center gap-2">
    <input type="radio" name="gender" value="FEMALE"
    {% if c.gender == "FEMALE" %}checked{% endif %}
    class="accent-green-600"> Female
  </label>
  <label class="flex items-center gap-2">
    <input type="radio" name="gender" value="OTHER"
    {% if c.gender == "OTHER" %}checked{% endif %}
    class="accent-green-600"> Other
  </label>
</div>
</div>

<!-- BUTTONS -->
<div class="pt-6 border-t border-green-100 flex gap-4">
  <button type="submit"
    class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-semibold transition">
    Save Changes
  </button>
  <a href="{% url 'profile' %}"
    class="px-6 py-3 rounded-xl font-semibold text-green-700 hover:underline">
    Cancel
  </a>
</div>

</div>
</div>

</div>

</form>

</main>

<script>
function togglePassword(){
  const input=document.getElementById("passwordInput");
  input.type=input.type==="password"?"text":"password";
}

function validateForm(){
  const name=document.querySelector("input[name='name']").value.trim();
  if(name.length<3){
    alert("Name must be at least 3 characters");
    return false;
  }
  return true;
}

document.getElementById("profileImage").addEventListener("change",function(){
  const file=this.files[0];
  if(!file) return;
  const allowed=["image/jpeg","image/png","image/jpg","image/webp"];
  if(!allowed.includes(file.type)){
    alert("Only JPG, PNG, WEBP images allowed");
    this.value="";
    return;
  }
  if(file.size>2*1024*1024){
    alert("Image must be less than 2MB");
    this.value="";
  }
});

// REMOVE PROFILE IMAGE
const removeBtn = document.getElementById("removeImageBtn");
const profilePreview = document.getElementById("profilePreview");
const profileInput = document.getElementById("profileImage");

if(removeBtn){
  removeBtn.addEventListener("click", function(){
    profileInput.value = "";
    profilePreview.outerHTML = `
      <div id="profilePreview"
        class="w-32 h-32 rounded-full border-2 border-dashed border-green-400
        bg-green-50 flex flex-col items-center justify-center
        hover:bg-green-100 transition">

        <span class="material-symbols-outlined text-green-700 text-3xl">photo_camera</span>
        <span class="text-xs text-green-700 mt-1">Tap to add</span>

      </div>
    `;

    const removeHidden = document.createElement("input");
    removeHidden.type = "hidden";
    removeHidden.name = "remove_image";
    removeHidden.value = "1";
    document.querySelector("form").appendChild(removeHidden);
  });
}
</script>

</body>
</html>
